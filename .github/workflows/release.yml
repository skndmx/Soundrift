name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.0)"
        required: true
        default: "v1.5.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and create DMG
        run: |
          chmod +x scripts/create-dmg.sh
          ./scripts/create-dmg.sh

      - name: Verify DMG artifact
        run: |
          ls -la dist/
          test -n "$(find dist -maxdepth 1 -name 'Soundrift-*.dmg' -print -quit)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Soundrift ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: dist/Soundrift-*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
